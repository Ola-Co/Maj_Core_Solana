[package]
name = "maj_core"
version = "0.1.0"
description = "Maj multisig program for Solana — port of MajFactory.sol + Maj.sol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "maj_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }

[dev-dependencies]
